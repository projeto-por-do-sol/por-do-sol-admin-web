<app-section-title [lable]="'Unidades'" [section]="'Quiosques'" [text]="'Status ao vivo de cada ponto de venda na praia.'" [labelButton]="'Adicionar quiosque'" (onClickButton)="goToKioskRegister()" [icon]="'add'" [prefix]="true"></app-section-title>

<app-chips [options]="chipOptions" [standardOption]="standardOption" (outputSelected)="onSelectedOption($event)"></app-chips>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-7">
  @if(selectedKiosk.length === 0){
  <p class="text-center col-span-2 text-outline font-semibold text-lg bg-border">Nenhum quiosque!</p>
  }
  @for(kiosk of selectedKiosk; track kiosk.id){
  <app-card-kiosk-info [kiosk]="kiosk"></app-card-kiosk-info>
  }
</div>
