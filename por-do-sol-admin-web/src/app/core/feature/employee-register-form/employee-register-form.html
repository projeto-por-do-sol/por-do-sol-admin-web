<div class="bg-surface p-8 rounded-2xl border border-border grid grid-cols-1">
  <form [formGroup]="formFields" (ngSubmit)="onSubmit()">
    <!-- Dados do quiosque -->
    <div class="sectionCard">
      <h2>Dados do quiosque</h2>
      <app-input [id]="'name'" [label]="'Nome do colaborador'" [name]="'name'" formControlName="name" [placeholder]="'Ex.: Cantinho da Maré'"></app-input>

      <div class="grid md:flex gap-10">
        <app-input [id]="'email'" [label]="'E-mail de contato'" [name]="'email'" type="e-mail" formControlName="email" [placeholder]="'contato@pordosol.com.br'" class="flex-1"></app-input>
        <app-input [id]="'phone'" [label]="'Telefone'" [name]="'phone'" formControlName="phone" [placeholder]="'(11) 99999-9999'" class="flex-1"></app-input>
      </div>
    </div>

    <!-- Funcionamento -->
    <div class="sectionCard">
      <h2>Alocação</h2>

      <div class="allocation flex gap-8 justify-between min-w-0">
        <app-select class="flex-1 min-w-0" [selectTitle]="'Quiosque'" [options]="['Teste', 'Teste2', 'Teste3']" (valueChange)="setKiok($event)"></app-select>
        <app-select class="flex-1 min-w-0" [selectTitle]="'Cargo'" [options]="['Funcionário', 'Gerente']" (valueChange)="setRole($event)"></app-select>
      </div>

      <div class="openTime">
        <app-input [id]="'startShift'" [label]="'Início turno'" [name]="'startShift'" [type]="'time'" formControlName="startShift" [isObrigatory]="false"></app-input>
        <app-input [id]="'finishShift'" [label]="'Fim turno'" [name]="'finishShift'" [type]="'time'" formControlName="finishShift" [isObrigatory]="false"></app-input>
      </div>

      <app-chip-multi-choice [options]="['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sabado', 'Domingo']" (outputSelected)="setDaysShift($event)"></app-chip-multi-choice>

    </div>

    <div class="grid md:flex md:justify-end gap-5">
      <app-cancel-button (onClickButton)="onClickCancel()"></app-cancel-button>
      <app-button [labelButton]="'Cadastrar quiosque'" [icon]="'add'" type="submit"></app-button>
    </div>

  </form>
</div>
