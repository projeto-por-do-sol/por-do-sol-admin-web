<div class="bg-surface p-8 rounded-2xl border border-border grid grid-cols-1">
  <form [formGroup]="formFields" (ngSubmit)="onSubmit()">
    <!-- Dados do funcionário -->
    <div class="sectionCard">
      <h2>Dados do funcionário</h2>
      <app-input [id]="'name'" [label]="'Nome do colaborador'" [name]="'name'" formControlName="name" [placeholder]="'Ex.: João da Silva'"></app-input>

      <div class="grid md:flex gap-10">
        <app-input [id]="'email'" [label]="'E-mail de contato'" [name]="'email'" type="email" formControlName="email" [placeholder]="'contato@pordosol.com.br'" class="flex-1"></app-input>
        <app-input [id]="'phone'" [label]="'Telefone'" [name]="'phone'" formControlName="phone" [placeholder]="'(11) 99999-9999'" class="flex-1" mask="phone"></app-input>
      </div>
    </div>

    <!-- Funcionamento -->
    <div class="sectionCard">
      <h2>Alocação</h2>

      <div class="allocation flex gap-8 justify-between min-w-0">
        <app-select class="flex-1 min-w-0" [selectTitle]="'Quiosque'" [options]="kioskNames()" [selectedValue]="kiosk()" (valueChange)="setKiok($event)"></app-select>
        <app-select class="flex-1 min-w-0" [selectTitle]="'Cargo'" [options]="['Funcionário', 'Gerente']" [selectedValue]="role()" (valueChange)="setRole($event)"></app-select>
      </div>

      <div class="openTime">
        <app-input [id]="'startShift'" [label]="'Início turno'" [name]="'startShift'" [type]="'time'" formControlName="startShift" [isObrigatory]="false"></app-input>
        <app-input [id]="'finishShift'" [label]="'Fim turno'" [name]="'finishShift'" [type]="'time'" formControlName="finishShift" [isObrigatory]="false"></app-input>
      </div>

      <app-chip-multi-choice [options]="['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo']" [initialSelection]="selectedDays()" (outputSelected)="setDaysShift($event)"></app-chip-multi-choice>

    </div>

    <div class="grid gap-5 md:flex md:items-center md:justify-between">
      @if (employee()) {
        <button type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-error bg-error px-4 py-2 font-semibold text-on-error cursor-pointer hover:enabled:bg-red focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-outline md:w-auto" aria-label="Remover funcionário da equipe" (click)="openRemoveDialog()">
          <img src="assets/icons/delete_forever.svg" class="size-6" alt="" aria-hidden="true">
          Remover funcionário
        </button>
      }
      <div class="grid gap-5 md:ml-auto md:flex md:justify-end">
        <app-cancel-button (onClickButton)="onClickCancel()"></app-cancel-button>
        <app-button [labelButton]="employee() ? 'Salvar alterações' : 'Cadastrar funcionário'" [icon]="employee() ? undefined : 'add'" type="submit"></app-button>
      </div>
    </div>

  </form>
  <dialog #removeDialog class="m-auto w-11/12 max-w-md rounded-2xl border border-border bg-surface p-6 text-outline shadow-2xl backdrop:bg-black/20 sm:p-8" aria-labelledby="remove-employee-title" aria-describedby="remove-employee-description">
    <div class="grid gap-5">
      <h2 id="remove-employee-title">Remover funcionário?</h2>
      <p id="remove-employee-description" class="text-sub-text">Deseja remover {{ employee()?.name }} da equipe? Esta ação não pode ser desfeita.</p>
      <div class="grid gap-3 sm:flex sm:justify-end">
        <app-cancel-button (onClickButton)="closeRemoveDialog()"></app-cancel-button>
        <button type="button" class="inline-flex w-full items-center justify-center rounded-2xl border-2 border-error bg-error px-4 py-2 font-semibold text-on-error cursor-pointer hover:bg-red focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-outline sm:w-auto" aria-label="Confirmar remoção do funcionário" (click)="confirmRemoveEmployee()">Remover funcionário</button>
      </div>
    </div>
  </dialog>
</div>
