<dialog #dialog class="m-auto max-h-[90dvh] w-11/12 max-w-lg overflow-hidden rounded-3xl border border-border bg-surface p-0 text-outline shadow-2xl backdrop:bg-black/20" aria-labelledby="new-orders-title" (mousedown)="onDialogMousedown($event)" (click)="onDialogClick($event)" (close)="closed.emit()">
  <div class="flex max-h-[90dvh] flex-col">
    <header class="flex shrink-0 items-start justify-between gap-4 px-5 pb-5 pt-5 sm:px-8 sm:pt-8">
      <div class="grid gap-1">
        <p class="text-base font-medium tracking-widest text-primary">NOTIFICAÇÕES</p>
        <h3 id="new-orders-title" class="text-2xl font-bold text-outline">Pedidos novos e cancelados</h3>
      </div>
      <button type="button" class="grid size-11 shrink-0 cursor-pointer place-items-center rounded-full border border-border bg-surface text-2xl text-outline hover:bg-fundo focus-visible:outline-2 focus-visible:outline-primary" aria-label="Fechar notificações" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
      </button>
    </header>

    <div class="grid gap-3 overflow-y-auto border-t border-border p-4 sm:p-6">
      @for (order of orders(); track order.id) {
      <button type="button" class="grid cursor-pointer gap-1 rounded-2xl border border-border bg-surface p-4 text-left hover:bg-fundo focus-visible:outline-2 focus-visible:outline-primary" (click)="selected.emit(order)">
        <span class="flex items-start justify-between gap-4">
          <span class="truncate text-lg font-semibold text-outline">{{ order.clientName }}</span>
          <strong class="whitespace-nowrap text-primary">{{ formatCurrency(order.value) }}</strong>
        </span>
        <span class="flex items-center gap-2">
          <span [class]="order.status === 'CANCELADO' ? 'rounded-xl bg-light-gray px-2 py-1 text-xs font-semibold text-sub-text' : 'rounded-xl bg-primary px-2 py-1 text-xs font-semibold text-creme'">{{ tag(order) }}</span>
          @if (order.interno) { <span class="text-xs font-semibold text-sub-text">Balcão</span> }
        </span>
        <span class="text-sm text-sub-text">
          @if (showKiosk()) { {{ order.kioskName }} · }{{ order.createdAt | date:'dd/MM/yyyy HH:mm' }}
        </span>
      </button>
      } @empty {
      <p class="py-6 text-center text-base text-sub-text">Nenhuma novidade nos pedidos.</p>
      }
    </div>
  </div>
</dialog>
