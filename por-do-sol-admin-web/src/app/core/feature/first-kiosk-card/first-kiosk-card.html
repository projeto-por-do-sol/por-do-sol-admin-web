<div class="w-full bg-surface rounded-2xl p-8 md:p-12 flex flex-col items-center text-center gap-4">
  <h2 class="font-poppins text-3xl md:text-4xl font-bold text-primary">Cadastre agora o seu primeiro quiosque</h2>
  <p class="text-outline text-lg md:text-xl max-w-2xl">
    Você ainda não tem nenhum quiosque cadastrado. Cadastre o primeiro para começar a acompanhar pedidos, equipe, itens e estatísticas.
  </p>
  <app-button [labelButton]="'Cadastrar quiosque'" [icon]="'add'" [prefix]="true" (onClickButton)="goToKioskRegister()"></app-button>
</div>
