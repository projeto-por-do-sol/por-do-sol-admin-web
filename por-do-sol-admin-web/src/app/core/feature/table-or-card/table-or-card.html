@if(emptyMessage() && ELEMENT_DATA().length === 0){
<p class="text-center text-outline font-semibold text-lg bg-border">{{ emptyMessage() }}</p>
} @else if(!isMobile()){
<app-table [columns]="columns()" [ELEMENT_DATA]="ELEMENT_DATA()" [cellTemplate]="cellTemplate()" [clickableRows]="clickableRows()" (rowClick)="rowClick.emit($event)"></app-table>
} @else{
<app-card-table [ELEMENT_DATA]="ELEMENT_DATA()" [cardTemplate]="cardTemplate()"></app-card-table>
}
