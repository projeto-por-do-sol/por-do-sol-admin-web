<div class="cards">
  @for (item of items; track $index) {

  <ng-container *ngTemplateOutlet="cardTemplate(); context: { $implicit: item }">
  </ng-container>

  }
</div>

<mat-paginator [length]="ELEMENT_DATA().length" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)">
</mat-paginator>
