<div class="flex items-center gap-2">
  @if (status() === 'Esperando confirmação') {
    <button type="button" class="grid size-9 place-items-center rounded-full bg-light-green text-green cursor-pointer hover:brightness-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" aria-label="Aceitar pedido" title="Aceitar pedido" (click)="statusChange.emit('Aceito')"><span class="status-action-icon check-icon" aria-hidden="true"></span></button>
    <button type="button" class="grid size-9 place-items-center rounded-full bg-error-container text-error cursor-pointer hover:brightness-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" aria-label="Recusar pedido" title="Recusar pedido" (click)="statusChange.emit('Cancelado')"><span class="status-action-icon close-icon" aria-hidden="true"></span></button>
  } @else if (nextStatus(); as next) {
    <button type="button" class="rounded-2xl bg-fundo px-4 py-2 font-medium text-primary cursor-pointer hover:brightness-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" [attr.aria-label]="'Avançar para ' + next" [attr.title]="'Avançar para ' + next" (click)="statusChange.emit(next)">Avançar</button>
  } @else {
    <span class="text-sub-text" aria-label="Sem alteração disponível">—</span>
  }
</div>
