<button (click)="onClickButton.emit($event)" type="{{type()}}" class="bg-primary text-creme text-base font-medium px-4 py-2 cursor-pointer rounded-2xl hover:bg-marrom flex gap-2 w-full md:w-max justify-center transition-all">
  @if(icon() && prefix()){
  <img [src]="iconPath" alt="">
  }
  {{ labelButton() }}
  @if(icon() && !prefix()){
  <img [src]="iconPath" alt="">

  }
</button>
