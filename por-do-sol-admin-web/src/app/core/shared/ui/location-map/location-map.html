<div class="grid gap-3">
  <div
    #mapElement
    class="location-map"
    role="application"
    [attr.aria-label]="readonly() ? 'Mapa com a localização do pedido' : 'Mapa para selecionar a localização do quiosque'"
  ></div>

  @if (!readonly()) {
  <p class="text-sm text-sub-text">
    Clique ou toque no mapa para marcar a localização exata do quiosque.
  </p>
  }
</div>
