<div class="md:grid md:grid-cols-2 md:gap-5 lg:flex justify-between">
  @for (card of cards; track card) {
  <div class="mb-5 md:mb-0 bg-surface w-full border border-border rounded-2xl p-5 overflow-hidden">
    <app-skeleton class="mt-1 mb-4 h-4 w-2/3"></app-skeleton>
    <app-skeleton class="mb-3 h-6 w-1/2"></app-skeleton>
    <div class="flex h-6 items-center gap-1.5">
      <app-skeleton shape="round" class="size-5 shrink-0"></app-skeleton>
      <app-skeleton class="h-4 flex-1"></app-skeleton>
    </div>
  </div>
  }
</div>
