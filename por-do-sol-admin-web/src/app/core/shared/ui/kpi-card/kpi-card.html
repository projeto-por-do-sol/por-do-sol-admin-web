<div class="md:grid md:grid-cols-2 md:gap-5 lg:flex justify-between">
  @for( kpi of kpis(); track kpi.lable){
  <!-- Card -->
  <div class="mb-5 md:mb-0 bg-surface w-full  border border-secondary rounded-2xl p-5 overflow-hidden">

    <!-- Label -->
    <p class="text-outline text-base mb-2">{{kpi.lable}}</p>
    <!-- Valor -->
    <p class="text-outline font-bold text-2xl mb-2 truncate">{{kpi.value}}</p>

    <!-- svg com indicador de subida ou queda -->
    <div [className]="kpi.direction ? 'text-green' : 'text-red'">
      <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
        @if(kpi.direction){
        <path d="M480-528 296-344l-56-56 240-240 240 240-56 56-184-184Z" />
        } @else {
        <path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z" />
        }
      </svg>

      <!-- Tendência de subida ou queda -->
      <p class="font-medium text-sm truncate flex-1">
        {{kpi.variation}} vs. ontem
      </p>
    </div>

  </div>
  }
</div>
