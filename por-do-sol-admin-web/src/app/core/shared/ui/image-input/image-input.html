<div class="grid gap-2">
  <div class="flex items-center justify-between gap-4">
    <label class="text-base font-semibold text-outline" [for]="id()">{{ label() }}</label>
    <span class="text-xs font-semibold text-sub-text">Opcional</span>
  </div>

  <label
    class="group relative flex h-48 cursor-pointer flex-col items-center justify-center gap-2 overflow-hidden rounded-2xl border-2 border-dashed border-secondary bg-fundo text-center text-outline transition-all hover:border-primary hover:bg-surface focus-within:border-primary focus-within:bg-surface focus-within:ring-3 focus-within:ring-primary/20 sm:h-56"
    [class.border-solid]="previewUrl"
    [class.bg-outline]="previewUrl"
    [class.cursor-not-allowed]="disabled"
    [class.opacity-60]="disabled"
    [for]="id()">
    <input class="absolute size-px opacity-0" #fileInput [id]="id()" type="file" [accept]="accept()" [disabled]="disabled" (change)="handleFile($event)">

    @if (previewUrl) {
      <img class="h-full w-full object-cover" [src]="previewUrl" [alt]="'Prévia de ' + fileName">
      <div class="absolute inset-x-0 bottom-0 flex items-center justify-center gap-2 bg-outline/80 p-3 font-semibold text-on-tertiary">
        <svg class="w-7 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-5h4l-7-7-7 7h4v5Zm-4 4h14v-2H5v2Z"/></svg>
        <span>Trocar imagem</span>
      </div>
      <button type="button" class="absolute top-2.5 right-2.5 grid size-8 cursor-pointer place-items-center rounded-full bg-surface text-2xl leading-none text-primary shadow-lg" aria-label="Remover imagem" (click)="removeImage($event, fileInput)">×</button>
    } @else {
      <span class="grid size-13 place-items-center rounded-full bg-on-secondary text-primary" aria-hidden="true">
        <svg class="w-7 fill-current" viewBox="0 0 24 24"><path d="M9 16h6v-5h4l-7-7-7 7h4v5Zm-4 4h14v-2H5v2Z"/></svg>
      </span>
      <strong class="text-sm font-bold sm:text-base">Clique para enviar uma imagem</strong>
      <small class="px-4 text-sub-text">{{ hint() }}</small>
    }
  </label>

  @if (errorMessage) {
    <span class="text-sm text-error">{{ errorMessage }}</span>
  }
</div>
