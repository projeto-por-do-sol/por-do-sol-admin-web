<div class="bg-surface border border-border rounded-2xl p-8 w-full mt-7 lg:mt-0">
  <app-skeleton class="h-6 w-3/4"></app-skeleton>
  <div class="flex my-4 items-center gap-5">
    <app-skeleton shape="round" class="size-14 shrink-0"></app-skeleton>
    <div class="grid flex-1 gap-2">
      <app-skeleton class="h-5 w-2/3"></app-skeleton>
      <app-skeleton class="h-4 w-1/3"></app-skeleton>
    </div>
  </div>
  <div class="grid grid-cols-1 border-y-2 border-border border-dashed py-4 gap-4">
    @for (row of rows; track row) {
    <div class="flex h-6 items-center justify-between gap-4">
      <app-skeleton class="h-4 w-1/3"></app-skeleton>
      <app-skeleton class="h-4 w-1/3"></app-skeleton>
    </div>
    }
  </div>
  <app-skeleton class="mt-4 h-4 w-3/4"></app-skeleton>
</div>
