<div>
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>FUNCIONÁRIO</th>
      <td mat-cell *matCellDef="let employee">{{employee.name}}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>CARGO</th>
      <td mat-cell *matCellDef="let employee">{{employee.role}}</td>
    </ng-container>

    <ng-container matColumnDef="kiosk">
      <th mat-header-cell *matHeaderCellDef>QUIOSQUE</th>
      <td mat-cell *matCellDef="let employee">{{employee.kiosk}}</td>
    </ng-container>

    <ng-container matColumnDef="shift">
      <th mat-header-cell *matHeaderCellDef>TURNO</th>
      <td mat-cell *matCellDef="let employee">{{employee.startShift}}-{{employee.finishShift}}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>STATUS</th>
      <td mat-cell *matCellDef="let employee">{{employee.role}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Lista de funcionários de todos os quiosques cadastrados">
  </mat-paginator>

</div>
