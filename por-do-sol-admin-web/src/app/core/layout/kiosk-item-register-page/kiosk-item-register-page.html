<main class="m-8 relative">
  <app-return-link text="Voltar para home"></app-return-link>
  <app-section-title lable="Cardápio" [section]="itemId ? 'Editar item' : 'Cadastrar novo item'" [text]="itemId ? 'Atualize os dados, a imagem e o valor do item.' : 'Informe os dados do item, escolha o quiosque e defina o valor para adicioná-lo ao cardápio.'"></app-section-title>

  @if (!itemId || item) {
  <div class="grid grid-cols-1 lg:grid-cols-5 lg:gap-8 relative items-start">
    <app-kiosk-item-register-form #itemForm class="min-w-0 lg:col-span-3" [item]="item ?? null" (onClickCancelButton)="goToHome()"></app-kiosk-item-register-form>
    <app-card-preview class="min-w-0 lg:col-span-2 lg:sticky lg:top-8" contextLabel="aba Itens" [name]="itemForm.previewName()" [role]="itemForm.previewCategory()" [items]="itemForm.previewItems()" [imageUrl]="itemForm.imagePreview()" [showItemPlaceholder]="true" [lastText]="itemForm.previewLastText"></app-card-preview>
  </div>
  } @else {
    <p class="mt-8 text-outline">Item não encontrado.</p>
  }

  <p class="text-input-placeholder font-medium text-base mt-12 mb-4">Painel administrativo Pôr do Sol · itens</p>
</main>
