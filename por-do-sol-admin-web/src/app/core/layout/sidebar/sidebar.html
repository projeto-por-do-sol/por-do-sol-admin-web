<div class="bg-primary p-4 md:base-sidebar md:h-screen md:flex md:flex-col md:justify-between ">

  <div class="md:flex-1">

    <!-- Nome Site -->
    <div class="flex gap-5 px-2 pt-1">
      <img src="/assets/images/logo.png" alt="" class="w-10 h-10 self-center">
      <div>
        <h1 class="font-poppins text-xl text-creme font-bold">Apollo</h1>
        <p class="font-poppins text-sm text-amarelo font-medium">PAINEL DE GESTÃO</p>
      </div>
    </div>

    <!-- Links de Navegação -->
    <div class="my-7 px-2">
      <p class="text-secondary font-poppins font-medium">QUIOSQUE SELECIONADO</p>
      <mat-select class="select" panelClass="quiosque-panel" [(value)]="selectedKiosk">
        <mat-option value="">Todos</mat-option>
        <mat-option value="teste" class="">Quiosque 1 Quiosque 1 Quiosque 1 Quiosque 1</mat-option>
        <mat-option value="teste2">Quiosque 2</mat-option>
      </mat-select>
    </div>

    <div class="flex overflow-x-auto md:grid md:overflow-visible">
      <a class="side-bar-link" routerLink="/" fragment="visao-geral" [class.active]="navigation.activeSection() === 'visao-geral'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z" />
        </svg>
        <p class="">Visão geral</p>
      </a>

      <a class="side-bar-link" routerLink="/" fragment="estatisticas" [class.active]="navigation.activeSection() === 'estatisticas'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z" />
        </svg>
        <p class="">Estatísticas</p>
      </a>

      @if(!selectedKiosk){
      <a class="side-bar-link" routerLink="/" fragment="quiosques" [class.active]="navigation.activeSection() === 'quiosques'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M841-518v318q0 33-23.5 56.5T761-120H201q-33 0-56.5-23.5T121-200v-318q-23-21-35.5-54t-.5-72l42-136q8-26 28.5-43t47.5-17h556q27 0 47 16.5t29 43.5l42 136q12 39-.5 71T841-518Zm-272-42q27 0 41-18.5t11-41.5l-22-140h-78v148q0 21 14 36.5t34 15.5Zm-180 0q23 0 37.5-15.5T441-612v-148h-78l-22 140q-4 24 10.5 42t37.5 18Zm-178 0q18 0 31.5-13t16.5-33l22-154h-78l-40 134q-6 20 6.5 43t41.5 23Zm540 0q29 0 42-23t6-43l-42-134h-76l22 154q3 20 16.5 33t31.5 13ZM201-200h560v-282q-5 2-6.5 2H751q-27 0-47.5-9T663-518q-18 18-41 28t-49 10q-27 0-50.5-10T481-518q-17 18-39.5 28T393-480q-29 0-52.5-10T299-518q-21 21-41.5 29.5T211-480h-4.5q-2.5 0-5.5-2v282Zm560 0H201h560Z" />
        </svg>
        <p class="">Quiosques</p>
      </a>
      }

      <a class="side-bar-link" routerLink="/" fragment="equipe" [class.active]="navigation.activeSection() === 'equipe'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M0-240v-63q0-43 44-70t116-27q13 0 25 .5t23 2.5q-14 21-21 44t-7 48v65H0Zm240 0v-65q0-32 17.5-58.5T307-410q32-20 76.5-30t96.5-10q53 0 97.5 10t76.5 30q32 20 49 46.5t17 58.5v65H240Zm540 0v-65q0-26-6.5-49T754-397q11-2 22.5-2.5t23.5-.5q72 0 116 26.5t44 70.5v63H780ZM160-440q-33 0-56.5-23.5T80-520q0-34 23.5-57t56.5-23q34 0 57 23t23 57q0 33-23 56.5T160-440Zm640 0q-33 0-56.5-23.5T720-520q0-34 23.5-57t56.5-23q34 0 57 23t23 57q0 33-23 56.5T800-440Zm-320-40q-50 0-85-35t-35-85q0-51 35-85.5t85-34.5q51 0 85.5 34.5T600-600q0 50-34.5 85T480-480Z" />
        </svg>
        <p class="">Equipe</p>
      </a>

      <a class="side-bar-link" routerLink="/" fragment="pedidos" [class.active]="navigation.activeSection() === 'pedidos'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M120-80v-800l60 60 60-60 60 60 60-60 60 60 60-60 60 60 60-60 60 60 60-60 60 60 60-60v800l-60-60-60 60-60-60-60 60-60-60-60 60-60-60-60 60-60-60-60 60-60-60-60 60Zm120-200h480v-80H240v80Zm0-160h480v-80H240v80Zm0-160h480v-80H240v80Z" />
        </svg>
        <p class="">Pedidos</p>
      </a>
    </div>

    <!-- links de cadastro -->
    <div class="justify-items-center mt-3 relative">
      <button class="cursor-pointer block text-secondary text-base font-medium w-full py-2 rounded-2xl hover:bg-hover-sidebarlink hover:outline" (click)="setViewModal()">
        Cadastros
      </button>

      @if(viewModalRegister){
      <div class="fixed cursor-pointer inset-0 z-40 flex justify-center items-center" (click)="setViewModal()">
        <div class="md:absolute md:left-64 md:top-128 z-50 bg-surface border border-border grid rounded-2xl h-max">
          <button class="buttonModal" (click)="goToKioskRegister()">Quiosque</button>
          <button class="buttonModal" (click)="goToEmployeeRegister()">Funcionários</button>
        </div>
      </div>
      }
    </div>

  </div>


  <!-- Identificação do Usuário -->
  <div class="flex bg-fundo-escuro rounded-2xl p-4 gap-3 items-center mt-7 md:mt-5">
    <div class="flex rounded-full bg-amarelo w-10 h-10 min-w-10 justify-center items-center shrink-0">
      <p class="font-bold text-lg text-marrom font-poppins">{{userNameInitials}}</p>
    </div>
    <div class="min-w-0 flex-1">
      <p [title]="user().name" class="font-poppins font-semibold text-creme truncate">
        {{user().name}}
      </p>
      <p class="text-sm text-secondary truncate">
        <span [title]="user().position">{{user().position}}</span> • <span [title]="user().kiosk">{{user().kiosk}}</span>
      </p>
    </div>
  </div>

</div>
