<div class="min-h-dvh p-4 sm:p-8 flex flex-col">
  <app-return-link text="Voltar para login" pageToReturn="login" class="block mb-4"></app-return-link>

  <main class="flex-1 w-full flex justify-center items-center">

    <!-- Card -->
    <div class="bg-surface rounded-2xl w-full max-w-130 min-w-0 h-max overflow-hidden">

      <!-- Logo -->
      <div class="bg-linear-to-br from-primary to-tertiary flex items-center justify-center h-50">
        <img src="assets/images/logo.png" alt="Logo Apollo" class="size-40 rounded-full shadow-2xl">
      </div>

      <!-- Recuperar senha -->
      <div class="p-4 sm:p-6 grid min-w-0">
        <h1 class="text-outline text-2xl font-bold">Recuperar senha</h1>
        <p class="text-outline text-lg font-medium mb-3">CONFIRME SEU CÓDIGO</p>
        <p class="text-sub-text text-base">Digite os quatro caracteres do código de confirmação abaixo para continuar.</p>

        <div class="grid grid-cols-4 gap-2 sm:gap-5 w-full max-w-84 justify-self-center my-6" role="group" aria-label="Código de confirmação">
          @for (character of code; track $index) {
            <input
              #codeInput
              type="text"
              inputmode="text"
              autocomplete="one-time-code"
              maxlength="1"
              [value]="code[$index]"
              [attr.aria-label]="'Caractere ' + ($index + 1) + ' do código'"
              [attr.aria-invalid]="codeErrorMessage() ? 'true' : null"
              aria-describedby="code-feedback"
              (input)="onInput($index, $event)"
              (keydown)="onKeyDown($index, $event)"
              (paste)="onPaste($index, $event)"
              class="w-full max-w-16 min-w-0 h-16 sm:h-16 justify-self-center rounded-xl border-3 border-outline bg-transparent text-center text-2xl sm:text-3xl font-semibold text-primary uppercase focus:outline-none focus:border-primary hover:border-secondary"
            >
          }
        </div>

        <p id="code-feedback" class="text-center mb-3" [class.text-red-600]="codeErrorMessage()" [class.text-primary]="codeSuccessMessage()" role="status" aria-live="polite">
          {{ codeErrorMessage() || codeSuccessMessage() }}
        </p>

        <app-button labelButton="Confirmar código" [fullWidth]="true" (onClickButton)="confirmCode()"></app-button>

        <p class="text-outline text-base text-center mt-3">Não recebeu o código?</p>

        <!-- Contagem para enviar novo código -->
        <a class="text-primary text-base font-medium text-center justify-self-center mt-1 cursor-pointer">Solicitar novo código por e-mail</a>

        <p class="text-outline mt-1 text-center">5 solicitações disponíveis</p>
      </div>

    </div>
  </main>

</div>
