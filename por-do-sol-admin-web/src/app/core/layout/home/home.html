<!-- Header -->
<section id="inicio">
  <app-header></app-header>
</section>

<!-- Conteúdos -->
<main class="px-8 pb-8">

  <!-- Visão geral -->
  <section id="visao-geral">
    <app-section-title [lable]="'Resumo'" [section]="'Visão Geral'" [text]="'Resumo geral de seus quiosques'"></app-section-title>
    <app-kpi-card></app-kpi-card>

    <!-- @if(){

    } -->
    <!-- <app-card-kiosk-info></app-card-kiosk-info> -->
  </section>

  <section id="estatisticas">
    <app-section-title [lable]="'Desempenho'" [section]="'Estatísticas'" [text]="'Pedidos, vendas por categoria e faturamento da semana deste quiosque'"></app-section-title>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
      <app-stacked-column class="lg:col-span-2"></app-stacked-column>
      <app-donut></app-donut>
      <app-zoomable-timeseries class="lg:col-span-2"></app-zoomable-timeseries>
      <app-radial-bar></app-radial-bar>
    </div>

  </section>

  <section id="quiosques">
    <app-section-title [lable]="'Unidades'" [section]="'Quiosques'" [text]="'Status ao vivo de cada ponto de venda na praia.'"></app-section-title>
    <app-kiosk-grid></app-kiosk-grid>
  </section>

  <section id="equipe">
    <app-section-title [lable]="'Equipe'" [section]="'Funcionários'" [text]="'Quem está em turno agora, em qual quiosque e em que horário.'"></app-section-title>
    <app-card-kiosk-info></app-card-kiosk-info>
  </section>

  <section id="pedidos">
    <app-section-title [lable]="'Fila em tempo real'" [section]="'Pedidos'" [text]="'Acompanhe cada pedido da cozinha até a entrega na cadeira de praia.'"></app-section-title>
    <app-card-kiosk-info></app-card-kiosk-info>
  </section>
</main>
