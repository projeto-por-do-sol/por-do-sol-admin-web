<div class="p-8">
  <app-return-link text="Voltar para home"></app-return-link>

  <main class="mt-8">
    <section class="max-w-100 rounded-2xl border border-border bg-surface p-6">
      <app-select
        class="block max-w-md"
        selectTitle="Quiosque"
        [options]="kioskNames()"
        [selectedValue]="selectedKioskName()"
        placeholder="Selecione um quiosque"
        (valueChange)="selectKioskByName($event)">
      </app-select>
    </section>

    <div class="mt-8">
      @if (selectedKiosk()) {
        @for (group of itemsByCategory(); track group.category) {
          <section class="mb-8" [attr.aria-label]="group.category">
            <h2 class="mb-4 border-b border-border pb-3 text-2xl font-semibold text-outline">{{ group.category }}</h2>
            <div class="grid auto-rows-fr grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
              @for (item of group.items; track item.id) {
                <app-item-card-for-order [item]="item"></app-item-card-for-order>
              }
            </div>
          </section>
        } @empty {
          <p class="rounded-2xl bg-border p-6 text-center text-lg font-semibold text-outline">Não há nenhum item cadastrado nesse quiosque!</p>
        }
      } @else {
        <p class="rounded-2xl bg-border p-6 text-center text-lg font-semibold text-outline">Não há nenhum quiosque selecionado!</p>
      }
    </div>
  </main>
</div>
