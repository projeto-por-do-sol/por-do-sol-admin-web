<!-- Botão logout -->
<!-- <button class="buttonModal" (click)="login()">Login</button> -->

<main class="relative flex h-full w-full md:justify-center md:items-center">
  <!-- card -->
  <div class="bg-surface w-full h-full md:max-w-120 md:h-max md:rounded-2xl overflow-auto z-10 shadow-2xl">

    <!-- Imagem -->
    <div class="bg-linear-to-br from-primary to-tertiary flex justify-center p-5"><img src="./assets/images/logo.png" alt="Apollo logo" class="w-35 drop-shadow-2xl"></div>

    <!-- Informações -->
    <div class="p-8">
      <h1 class="font-bold text-outline text-xl mb-1">Bem Vindo(a) ao Apollo!</h1>
      <p class="text-sub-text text-base mb-7">Entre com suas credenciais para acessar o Painel Administrativo</p>
      <form [formGroup]="form" (ngSubmit)="login()">
        <div class="grid grid-cols-1 gap-5 mb-5">
          <app-input label="Credencial" id="login" name="login" type="text" formControlName="email"></app-input>
          <app-input label="Senha" id="password" name="password" type="password" formControlName="password"></app-input>
        </div>

        <div class="flex justify-between mb-7">
          <div class="flex gap-2">
            <input type="checkbox" id="check" name="check" formControlName="rememberMe" class="accent-primary w-4 cursor-pointer">
            <label for="check" class="text-outline text-base cursor-pointer">Lembrar de mim</label>
          </div>

          <a routerLink="/informEmailForRecovery" class="text-base text-primary hover:underline">Esqueci minha senha</a>
        </div>

        @if (errorMessage()) {
          <p role="alert" class="mb-4 rounded-xl bg-error-container px-4 py-3 text-sm text-on-error-container">
            {{ errorMessage() }}
          </p>
        }

        <app-button [labelButton]="isLoading() ? 'Entrando...' : 'Entrar'" icon="arrow-right" type="submit" [disabled]="isLoading()" [fullWidth]="true"></app-button>

      </form>

      <div class="mt-3 text-center">
        <p class="text-outline text-base">Novo por aqui? <a routerLink="/ownerRegistration" class="text-primary cursor-pointer hover:underline">Crie sua conta!</a></p>
      </div>

      <!-- /Informações -->
    </div>

    <!-- /Card -->
  </div>

  <div class="absolute bottom-0 z-0 w-full">
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path d="M0,90 C240,140 480,60 720,95 C960,130 1200,55 1440,90 L1440,200 L0,200 Z" fill="#CB6436" opacity="0.1"></path>
      <path d="M0,120 C240,160 480,100 720,130 C960,160 1200,95 1440,125 L1440,200 L0,200 Z" fill="#C0420a" opacity="0.2"></path>
    </svg>
  </div>
</main>
